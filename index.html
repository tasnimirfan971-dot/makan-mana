<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Makan Mana" />
  <link rel="manifest" href="manifest.json" />
  <title>Makan Mana Hari Ini? 🍛</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.75rem;
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .controls-right {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 0.78rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }

    h1 {
      margin: 4px 0 6px;
      font-size: clamp(1.45rem, 5vw, 1.75rem);
    }

    p.subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .wheel-wrapper {
      position: relative;
      width: min(270px, 72vw);
      height: min(270px, 72vw);
      margin: 0 auto 20px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid var(--border);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 23px solid #ef4444;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
    }

    .spin-btn {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .spin-btn:hover {
      background: var(--accent-hover);
    }

    .spin-btn:active {
      transform: scale(0.98);
    }

    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 16px;
      padding: 16px;
      background: #0f172a;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: none;
    }

    .result-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fbbf24;
      margin-bottom: 6px;
    }

    .dare-text {
      font-size: 0.9rem;
      color: #38bdf8;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .share-btn {
      width: 100%;
      background: #22c55e;
      color: #052e16;
      border: none;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    .share-btn:hover {
      background: #16a34a;
      color: #ffffff;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #ffffff;
      outline: none;
    }

    .add-btn {
      background: #334155;
      color: #ffffff;
      border: none;
      padding: 0 18px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      justify-content: center;
    }

    .tag {
      background: #334155;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag span {
      cursor: pointer;
      color: #f87171;
      font-weight: 800;
      font-size: 1rem;
      line-height: 1;
    }

    .ios-tip {
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <audio id="bgMusic" src="lagu.mp3" loop preload="auto"></audio>

  <div class="container">
    <div class="top-bar">
      <span class="badge">Android &amp; iOS Ready</span>
      <div class="controls-right">
        <button class="mini-btn" id="musicToggle" type="button">🎵 Lagu: OFF</button>
        <button class="mini-btn" id="soundToggle" type="button">🔊 SFX: ON</button>
      </div>
    </div>

    <h1>Makan Mana Hari Ini? 🍽️</h1>
    <p class="subtitle">Untuk geng yang selalu jawab "Aku tak kisah"</p>

    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn" type="button">PUTAR SEKARANG 🎲</button>

    <div class="result-box" id="resultBox">
      <div class="result-title" id="winnerText"></div>
      <div class="dare-text" id="dareText"></div>
      <button class="share-btn" id="shareBtn" type="button">Salin Keputusan ke WhatsApp 📋</button>
    </div>

    <div class="input-group">
      <input type="text" id="placeInput" placeholder="Tambah kedai (cth: Nasi Kandar)" />
      <button class="add-btn" id="addBtn" type="button">+</button>
    </div>

    <div class="tags" id="tagList"></div>

    <p class="ios-tip">
      Tip: Buka di Safari (iOS) → <strong>Share</strong> → <strong>Add to Home Screen</strong>, atau di Chrome (Android) → <strong>Install app</strong>.
    </p>
  </div>

  <script>
    const STORAGE_KEY = "makan_mana_places_v1";
    const defaultPlaces = [
      "Mamak 24 Jam",
      "Ayam Gepuk",
      "Nasi Kandar",
      "Tomyam Seafood",
      "Burger Tepian",
      "Mee Tarik"
    ];

    let places = loadPlaces();

    const dares = [
      "Syarat: Yang tekan butang spin wajib belanja air semua orang! 🥤",
      "Syarat: Siapa paling lambat sampai kedai kena bayar parking/tip. 💸",
      "Syarat: Tak boleh order air kosong hari ni, wajib order air manis! 🧋",
      "Syarat: Keputusan muktamad! Siapa bantah kena pilih kedai lain dalam 5 saat. ⏱️",
      "Syarat: Yang paling banyak cakap 'tak kisah' tadi kena ambilkan sudu & tisu. 🍴",
      "Syarat: Semua orang wajib letak phone atas meja sampai makanan sampai. 📵"
    ];

    const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#8b5cf6", "#ec4899"];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const resultBox = document.getElementById("resultBox");
    const winnerText = document.getElementById("winnerText");
    const dareText = document.getElementById("dareText");
    const shareBtn = document.getElementById("shareBtn");
    const placeInput = document.getElementById("placeInput");
    const addBtn = document.getElementById("addBtn");
    const tagList = document.getElementById("tagList");
    const soundToggle = document.getElementById("soundToggle");
    const musicToggle = document.getElementById("musicToggle");
    const bgMusic = document.getElementById("bgMusic");

    let currentRotation = 0;
    let lastResultMessage = "";
    let soundEnabled = true;
    let musicEnabled = false;
    let audioCtx = null;

    if (bgMusic) {
      bgMusic.volume = 0.45;
    }

    function loadPlaces() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.length >= 2) return saved;
      } catch (e) {}
      return [...defaultPlaces];
    }

    function savePlaces() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(places));
      } catch (e) {}
    }

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTick() {
      if (!soundEnabled) return;
      const ctxAudio = getAudioContext();
      if (!ctxAudio) return;

      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(680, ctxAudio.currentTime);
      gain.gain.setValueAtTime(0.08, ctxAudio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + 0.045);

      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      osc.start();
      osc.stop(ctxAudio.currentTime + 0.045);
    }

    function playWinJingle() {
      if (!soundEnabled) return;
      const ctxAudio = getAudioContext();
      if (!ctxAudio) return;

      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, idx) => {
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        const startTime = ctxAudio.currentTime + idx * 0.11;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.12, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.26);
      });
    }

    function syncMusicState() {
      if (!bgMusic) return;
      if (musicEnabled) {
        bgMusic.play().then(() => {
          musicToggle.textContent = "🎵 Lagu: ON";
        }).catch(() => {
          musicToggle.textContent = "🎵 Lagu: TAP";
        });
      } else {
        bgMusic.pause();
        musicToggle.textContent = "🎵 Lagu: OFF";
      }
    }

    musicToggle.addEventListener("click", () => {
      musicEnabled = !musicEnabled;
      syncMusicState();
    });

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? "🔊 SFX: ON" : "🔇 SFX: OFF";
      if (soundEnabled) playTick();
    });

    function drawWheel() {
      const numOptions = places.length;
      const arcSize = (2 * Math.PI) / numOptions;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      places.forEach((place, i) => {
        const angle = i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 200, angle, angle + arcSize);
        ctx.fill();

        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 17px sans-serif";
        ctx.fillText(place, 176, 6);
        ctx.restore();
      });
    }

    function renderTags() {
      tagList.innerHTML = "";
      places.forEach((place, index) => {
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.innerHTML = `${place} <span onclick="removePlace(${index})">×</span>`;
        tagList.appendChild(tag);
      });
    }

    window.removePlace = function(index) {
      if (places.length <= 2) {
        alert("Kena ada sekurang-kurangnya 2 pilihan kedai!");
        return;
      }
      places.splice(index, 1);
      savePlaces();
      drawWheel();
      renderTags();
    };

    addBtn.addEventListener("click", () => {
      const val = placeInput.value.trim();
      if (val) {
        places.push(val);
        placeInput.value = "";
        savePlaces();
        drawWheel();
        renderTags();
        playTick();
      }
    });

    placeInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") addBtn.click();
    });

    spinBtn.addEventListener("click", () => {
      spinBtn.disabled = true;
      resultBox.style.display = "none";

      if (!musicEnabled && bgMusic) {
        musicEnabled = true;
        syncMusicState();
      }

      playTick();

      const extraSpins = 5 + Math.floor(Math.random() * 5);
      const randomDegree = Math.floor(Math.random() * 360);
      currentRotation += extraSpins * 360 + randomDegree;

      canvas.style.transform = `rotate(${currentRotation}deg)`;

      let tickCount = 0;
      const tickInterval = setInterval(() => {
        tickCount++;
        playTick();
        if (tickCount >= 18) clearInterval(tickInterval);
      }, 160);

      setTimeout(() => {
        clearInterval(tickInterval);
        const actualDeg = currentRotation % 360;
        const pointerAngle = (270 - actualDeg + 360) % 360;
        const sliceDeg = 360 / places.length;
        const winningIndex = Math.floor(pointerAngle / sliceDeg);

        const chosenPlace = places[winningIndex];
        const randomDare = dares[Math.floor(Math.random() * dares.length)];

        winnerText.textContent = `🎉 Kita makan: ${chosenPlace}!`;
        dareText.textContent = randomDare;
        resultBox.style.display = "block";
        spinBtn.disabled = false;
        playWinJingle();

        lastResultMessage = `Keputusan Geng Hari Ini 🍽️\nLokasi: *${chosenPlace}*\n${randomDare}\n\nJom gerak sekarang!`;
      }, 4000);
    });

    shareBtn.addEventListener("click", async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(lastResultMessage);
        } else {
          const temp = document.createElement("textarea");
          temp.value = lastResultMessage;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand("copy");
          document.body.removeChild(temp);
        }
        shareBtn.textContent = "Done Copy For WhatsApp ✅";
        setTimeout(() => {
          shareBtn.textContent = "Copy For WhatsApp 📋";
        }, 2500);
      } catch (e) {
        alert("Gagal salin automatik, boleh salin manual dari kotak keputusan.");
      }
    });

    drawWheel();
    renderTags();
  </script>
</body>
</html>
